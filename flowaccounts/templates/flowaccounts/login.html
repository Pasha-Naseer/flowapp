{% extends 'home/base.html' %}
{% block content %}

<section class="auth-wrapper">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p>Login to continue to Flovv</p>

    <form method="post" action="{% url 'flowaccounts:login' %}" class="auth-form">
      {% csrf_token %}
      {{ form.as_p }}

      <button type="submit" class="auth-btn">
        Login
      </button>
    </form>
  </div>
</section>
<style>
    :root {
  --orange-main: #FF6600;
  --orange-soft: #FF9751;
  --blue-dark: #22305C;
  --blue-accent: #136197;
}

/* ===== AUTH LAYOUT ===== */
.auth-wrapper {
  min-height: 80vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(
    135deg,
    rgba(19,97,151,0.08),
    rgba(34,48,92,0.08)
  );
}

.auth-card {
  width: 100%;
  max-width: 420px;
  padding: 2.4rem;
  border-radius: 30px;
  background: #fff;
  box-shadow: 0 30px 70px rgba(0,0,0,0.25);
  text-align: center;
}

.auth-card h1 {
  font-size: 2rem;
  font-weight: 800;
  color: var(--blue-dark);
}

.auth-card p {
  color: #666;
  margin-bottom: 1.6rem;
}

/* ===== FORM ===== */
.auth-form input {
  width: 100%;
  border-radius: 14px;
  border: 1px solid rgba(0,0,0,0.12);
  padding: 0.6rem 0.8rem;
}

/* ===== BUTTON ===== */
.auth-btn {
  margin-top: 1rem;
  width: 100%;
  padding: 0.7rem;
  border-radius: 999px;
  border: none;
  background: linear-gradient(
    135deg,
    var(--orange-main),
    var(--orange-soft)
  );
  color: #fff;
  font-weight: 700;
  box-shadow: 0 10px 30px rgba(255,102,0,0.45);
  transition: all 0.3s ease;
}

.auth-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 40px rgba(255,102,0,0.65);
}

</style>
{% endblock %}
