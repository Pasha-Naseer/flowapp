{% extends 'home/base.html' %}
{% block content %}

<section class="auth-wrapper">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p>Join Flovv and start exploring</p>

    <form method="post" action="{% url 'flowaccounts:register' %}" class="auth-form">
      {% csrf_token %}
      {{ form.as_p }}

      <button type="submit" class="auth-btn">
        Register
      </button>
    </form>

    <p class="auth-footer">
      Already have an account?
      <a href="{% url 'flowaccounts:login' %}">Login</a>
    </p>
  </div>
</section>
<style>
    .auth-wrapper {
  min-height: 80vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(
    135deg,
    rgba(19,97,151,0.08),
    rgba(34,48,92,0.08)
  );
}

.auth-card {
  width: 100%;
  max-width: 420px;
  padding: 2.4rem;
  border-radius: 30px;
  background: #fff;
  box-shadow: 0 30px 70px rgba(0,0,0,0.25);
  text-align: center;
}

.auth-form input {
  width: 100%;
  border-radius: 14px;
  border: 1px solid rgba(0,0,0,0.12);
  padding: 0.6rem 0.8rem;
}

.auth-btn {
  margin-top: 1rem;
  width: 100%;
  padding: 0.7rem;
  border-radius: 999px;
  border: none;
  background: linear-gradient(
    135deg,
    #FF6600,
    #FF9751
  );
  color: #fff;
  font-weight: 700;
  box-shadow: 0 10px 30px rgba(255,102,0,0.45);
}

/* FOOTER */
.auth-footer {
  margin-top: 1.2rem;
  font-size: 0.9rem;
  color: #666;
}

.auth-footer a {
  color: #136197;
  font-weight: 700;
  text-decoration: none;
}

</style>
{% endblock %}
