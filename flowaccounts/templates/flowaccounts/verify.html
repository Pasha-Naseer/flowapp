{% extends 'home/base.html' %}
{% block content %}

<section class="auth-wrapper">
  <div class="auth-card">
    <h1>Verify Your Account</h1>
    <p>Enter the code sent to your email or phone</p>

    <form method="post" action="{% url 'flowaccounts:verify_code' %}" class="auth-form">
      {% csrf_token %}
      {{ form.as_p }}

      <button type="submit" class="auth-btn">Verify</button>
    </form>
  </div>
</section>
<style>
    /* ===== AUTH LAYOUT ===== */
.auth-wrapper {
  min-height: 80vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(
    135deg,
    rgba(19,97,151,0.08),
    rgba(34,48,92,0.08)
  );
}

.auth-card {
  width: 100%;
  max-width: 420px;
  padding: 2.4rem;
  border-radius: 30px;
  background: #fff;
  box-shadow: 0 30px 70px rgba(0,0,0,0.25);
  text-align: center;
}

.auth-card h1 {
  font-size: 2rem;
  font-weight: 800;
  color: #22305C;
}

.auth-card p {
  color: #666;
  margin-bottom: 1.6rem;
}

.auth-form input {
  width: 100%;
  border-radius: 14px;
  border: 1px solid rgba(0,0,0,0.12);
  padding: 0.6rem 0.8rem;
}

.auth-btn {
  margin-top: 1rem;
  width: 100%;
  padding: 0.7rem;
  border-radius: 999px;
  border: none;
  background: linear-gradient(
    135deg,
    #FF6600,
    #FF9751
  );
  color: #fff;
  font-weight: 700;
  box-shadow: 0 10px 30px rgba(255,102,0,0.45);

</style>
{% endblock %}
