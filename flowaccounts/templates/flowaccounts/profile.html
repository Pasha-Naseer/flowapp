{% extends 'home/base.html' %}
{% block content %}
    <img src="{{ profile.profile_pic.url }}">
    <h1>{{ profile.user.username }}</h1>

    <h2>{{ profile.first_name }} {{ profile.last_name }}</h2>
    <p>{{ profile.bio }}</p>

    <!--
    <div class="mt-3">
      <button type="button"
              value="add"
              class="btn btn-outline-secondary btn-sm update-cart rounded-pill px-3">
          {{ status }}
      </button>

    </div>
    -->

    <form method="post" action="{% url 'flowaccounts:profile' profile.id %}">
        {% csrf_token %}
        <input type="submit" value="{{ status }}">
    </form>

{% for event in events %}
    <img src="{{ event.image.url }}">
    <a href="{% url 'home:event_detail' event.category.id event.id %}"><h1>{{ event.name }}</h1></a>
{% endfor %}

{% endblock %}
