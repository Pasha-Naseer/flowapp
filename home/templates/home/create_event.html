{% extends 'home/base.html' %}

{% block content %}

<section class="container my-5">
  <div class="create-event-card">
    <h1>Create Event</h1>
    <p>Fill in the details below to create a new event</p>

    <form method="post" action="{% url 'home:create_event' category.id %}" class="create-event-form">
      {% csrf_token %}
      {{ form.as_p }}

      <button type="submit" class="create-btn">Create Event</button>
    </form>
  </div>
</section>
<style>
    /* ===== CREATE EVENT CARD ===== */
.create-event-card {
  max-width: 700px;
  margin: 0 auto;
  padding: 2.4rem 2rem;
  border-radius: 28px;
  background: linear-gradient(
    135deg,
    rgba(19,97,151,0.08),
    rgba(34,48,92,0.08)
  );
  box-shadow: 0 22px 55px rgba(0,0,0,0.2);
  text-align: center;
}

.create-event-card h1 {
  font-size: 2rem;
  font-weight: 800;
  color: #22305C;
  margin-bottom: 0.4rem;
}

.create-event-card p {
  color: #666;
  margin-bottom: 1.6rem;
}

/* ===== FORM ===== */
.create-event-form input,
.create-event-form textarea,
.create-event-form select {
  width: 100%;
  border-radius: 14px;
  border: 1px solid rgba(0,0,0,0.12);
  padding: 0.7rem 1rem;
  margin-bottom: 1rem;
  font-size: 1rem;
}

/* ===== BUTTON ===== */
.create-btn {
  padding: 0.8rem 2rem;
  border-radius: 999px;
  border: none;
  background: linear-gradient(135deg, #FF6600, #FF9751);
  color: #fff;
  font-weight: 700;
  box-shadow: 0 10px 30px rgba(255,102,0,0.45);
  transition: all 0.3s ease;
}

.create-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 40px rgba(255,102,0,0.65);
}

/* ===== MOBILE ===== */
@media (max-width: 768px) {
  .create-event-card {
    padding: 2rem 1.2rem;
  }
}

</style>
{% endblock %}
