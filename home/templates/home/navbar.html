{% load static %}

<nav class="flovv-navbar">
  <div class="nav-container">

    <!-- LOGO / BRAND -->
    <a href="/" class="nav-brand">
      Flovv
    </a>

    <!-- LINKS -->
    <div class="nav-links">


      <a href="{% url 'flowaccounts:explore' %}" class="nav-link">
        Explore
      </a>
      <a href="{% url 'home:notifications' %}" class="nav-link">
        Notifications
      </a>

      {% if request.user.profile %}
        <a href="{% url 'flowaccounts:my_profile' %}" class="nav-link highlight">
          My Profile
        </a>
      {% endif %}

      {% if request.user.is_authenticated %}
        <a href="{% url 'flowaccounts:logout' %}" class="nav-link danger">
          Logout
        </a>
      {% else %}
        <a href="{% url 'flowaccounts:register' %}" class="nav-link">
          Register
        </a>
        <a href="{% url 'flowaccounts:login' %}" class="nav-btn">
          Login
        </a>
      {% endif %}

    </div>
  </div>
</nav>
<style>
    :root {
  --orange-main: #FF6600;
  --orange-soft: #FF9751;
  --blue-dark: #22305C;
  --blue-accent: #136197;
}

/* ===== NAVBAR ===== */
.flovv-navbar {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(34, 48, 92, 0.85);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.nav-container {
  max-width: 1200px;
  margin: auto;
  padding: 0.8rem 1.2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* BRAND */
.nav-brand {
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: 1px;
  color: var(--orange-main);
  text-decoration: none;
}

/* LINKS */
.nav-links {
  display: flex;
  align-items: center;
  gap: 1.4rem;
}

.nav-link {
  color: #fff;
  font-weight: 500;
  text-decoration: none;
  opacity: 0.85;
  transition: all 0.25s ease;
}

.nav-link:hover {
  opacity: 1;
  color: var(--orange-soft);
}

/* PROFILE HIGHLIGHT */
.nav-link.highlight {
  color: var(--orange-main);
  font-weight: 700;
}

/* LOGOUT */
.nav-link.danger {
  color: #ffb3b3;
}

/* LOGIN BUTTON */
.nav-btn {
  padding: 0.45rem 1.1rem;
  border-radius: 999px;
  background: linear-gradient(
    135deg,
    var(--orange-main),
    var(--orange-soft)
  );
  color: #fff;
  font-weight: 700;
  text-decoration: none;
  box-shadow: 0 6px 20px rgba(255,102,0,0.4);
  transition: all 0.3s ease;
}

.nav-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(255,102,0,0.6);
}

/* MOBILE */
@media (max-width: 768px) {
  .nav-links {
    gap: 0.9rem;
  }

  .nav-brand {
    font-size: 1.3rem;
  }
}

</style>
